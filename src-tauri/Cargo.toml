[package]
name = "Photobooth"
version = "2.0.0"
description = "A Photobooth kiosk app made with Tauri + ReactTS"
authors = ["Risuleia", "Memorabooth"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.2.0", features = [] }
tauri-plugin-log = "2.9.0"
chrono = "0.4.45"
reqwest = { version = "0.13.4", features = ["json", "multipart"] }
image = "0.25.10"
imageproc = "0.27.0"
base64 = "0.23.1"
ab_glyph = "0.2.32"
tokio = "1.53.1"
dotenv_codegen = "0.15.0"
once_cell = "1.21.4"
uuid = { version = "1.26.0", features = ["v4", "serde"] }
dirs = "6.0.0"
